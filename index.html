<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Shifter</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #111;
      color: #f0f0f0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 1rem;
      padding: 2rem;
      box-sizing: border-box;
      background: radial-gradient(circle at top, #1f1f53, #09090f);
    }

    h1 {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: clamp(1.4rem, 2vw, 2rem);
    }

    #shape-name {
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      font-weight: 500;
      opacity: 0.85;
    }

    canvas {
      width: min(80vw, 600px);
      height: min(80vw, 600px);
      background: rgba(12, 12, 28, 0.85);
      border-radius: 20px;
      box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
    }

    .controls {
      display: grid;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      background: rgba(10, 10, 24, 0.7);
      border-radius: 16px;
      box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.3);
      width: min(80vw, 600px);
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      color: #eaeaf5;
    }

    .controls button {
      padding: 0.55rem 1.2rem;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      background: linear-gradient(135deg, #2c3ace, #3f6aff);
      color: #f4f4ff;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .controls button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .controls button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(17, 56, 194, 0.45);
    }

    label {
      font-size: 0.95rem;
      font-weight: 500;
    }

    input[type="range"] {
      width: clamp(200px, 40vw, 320px);
    }

    #speed-readout {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 2.5rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <header>
    <h1>Shape Shifter</h1>
    <div id="shape-name">Triangle</div>
  </header>
  <canvas id="scene" width="600" height="600"></canvas>
  <section class="controls" aria-label="Animation controls">
    <div class="control-group">
      <button id="pause-btn" type="button">Pause</button>
      <button id="resume-btn" type="button" disabled>Resume</button>
      <button id="reset-btn" type="button">Reset</button>
    </div>
    <div class="control-group">
      <label for="speed-slider">Ball Speed</label>
      <input id="speed-slider" type="range" min="60" max="400" step="10" value="220">
      <output id="speed-readout" for="speed-slider">220</output>
    </div>
    <div class="control-group">
      <label>
        <input id="tts-toggle" type="checkbox" checked>
        Speak shape name
      </label>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
